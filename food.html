   <style>
    .lang-switch {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 100;
    }
    .lang-switch button {
      margin-left: 5px;
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    .fotocock {
      width: 200px;
      height: 150px;
      overflow: hidden;
      margin-top: 10px;
    }
    .fotocock img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }
  </style>

        ]
      }
    };

    function renderMenu(lang) {
      const t = translations[lang];
      const menuDiv = document.getElementById("menu");
      menuDiv.innerHTML = "";

      const categories = ["uzkodas","zupa","karstie","deserti"];
      categories.forEach(cat => {
        const catDiv = document.createElement("div");
        catDiv.className = "zodiac";
        catDiv.innerHTML = `<span>${t.categories[cat]}<span>`;
        menuDiv.appendChild(catDiv);

        t.dishes.filter(d => d.cat === cat).forEach(dish => {
          const dishDiv = document.createElement("div");
          dishDiv.className = "cocktail";
          dishDiv.innerHTML = `
            <div class="text-block">
              <a>${dish.title}</a>
              <p class='sostav'>${dish.desc}</p>
            </div>
            <div class="fotocock">
              <img src="${dish.img || ''}" alt="${dish.title}">
            </div>
          `;
          menuDiv.appendChild(dishDiv);
        });
      });
    }

    renderMenu('lv');

    function setLang(lang) {
      renderMenu(lang);
    }
  </script>

</body>
</html>
